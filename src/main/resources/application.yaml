spring:
  application:
    name: libreria-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/libreria}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  sql:
    init:
      mode: never

logging:
  level:
    "[org.springframework.security]": DEBUG

jwt:
  secret:
    key: ${SECRET_KEY:59VssZGck87wZfG2EF7BfJO/oT7ek5rTuQyR3OP1KhOr4AdgotJCBSKNtmI7/ErZF4HAynu+ZtHkgCgu8LpClQ==}
  expiration: 900000
  refresh:
    duration: 604800000
